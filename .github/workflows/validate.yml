name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check skills
        run: python3 scripts/validate.py
      - name: Package skills
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: skills
          path: dist/*.zip
